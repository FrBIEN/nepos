[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
[program:php]
command=/usr/local/sbin/php-fpm --fpm-config /etc/nepos/php-fpm.conf
priority=10
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
[program:nginx]
command=/usr/sbin/nginx -e /dev/stderr -c /etc/nepos/nginx.conf -g "daemon off;"
priority=20
autorestart=unexpected
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
